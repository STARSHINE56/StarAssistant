name: Apply Update Check Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: |
          echo '' | base64 -d > /tmp/update.patch
          git apply /tmp/update.patch

      - name: Commit and push
        run: |
          git config user.name "STARSHINE56"
          git config user.email "starshine9@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix: replace website entry with manual update check"
          git push origin main
