name: Auto Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  YUNX_USE_MIRROR: "false"

concurrency:
  group: android-auto-release-main
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG="$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName \
            --jq '.[].tagName' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)"

          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            CURRENT="${LATEST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            PATCH=$((PATCH + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          # A deliberate minor-version update is the minimum for the next release.
          BASE_VERSION="1.1.2"
          if [ "$(printf '%s\n' "$VERSION" "$BASE_VERSION" | sort -V | tail -n 1)" = "$BASE_VERSION" ]; then
            VERSION="$BASE_VERSION"
          fi
          TAG="v${VERSION}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Next version: $TAG"

      - name: Determine version code
        id: version_code
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH + 10))

          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          echo "Version code: $VERSION_CODE"

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Restore release signing key
        shell: bash
        run: |
          test -n "$SIGNING_KEY_BASE64" || {
            echo "SIGNING_KEY_BASE64 secret is missing"
            exit 1
          }

          test -n "$RELEASE_STORE_PASSWORD" || {
            echo "RELEASE_STORE_PASSWORD secret is missing"
            exit 1
          }

          test -n "$RELEASE_KEY_ALIAS" || {
            echo "RELEASE_KEY_ALIAS secret is missing"
            exit 1
          }

          test -n "$RELEASE_KEY_PASSWORD" || {
            echo "RELEASE_KEY_PASSWORD secret is missing"
            exit 1
          }

          printf '%s' "$SIGNING_KEY_BASE64" \
            | base64 --decode \
            > release.keystore

          chmod 600 release.keystore

          keytool -list \
            -keystore release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            >/dev/null

      - name: Configure build
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version_code.outputs.code }}
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          export GRADLE_USER_HOME="$HOME/.gradle"

          mkdir -p "$GRADLE_USER_HOME"

          {
            printf 'RELEASE_STORE_FILE=%s\n' "$GITHUB_WORKSPACE/release.keystore"
            printf 'RELEASE_STORE_PASSWORD=%s\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\n' "$RELEASE_KEY_PASSWORD"
            printf 'VERSION_NAME=%s\n' "$VERSION_NAME"
            printf 'VERSION_CODE=%s\n' "$VERSION_CODE"
          } > "$GRADLE_USER_HOME/gradle.properties"

          chmod 600 "$GRADLE_USER_HOME/gradle.properties"
          chmod +x gradlew

      - name: Test project
        shell: bash
        run: |
          export GRADLE_USER_HOME="$HOME/.gradle"

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            testDebugUnitTest

      - name: Build signed APK
        shell: bash
        run: |
          export GRADLE_USER_HOME="$HOME/.gradle"

          ./gradlew \
            --no-daemon \
            --console=plain \
            -Pandroid.aapt2FromMavenOverride="$ANDROID_HOME/build-tools/35.0.0/aapt2" \
            clean \
            assembleRelease

      - name: Verify and collect APK
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK"

          mkdir -p output

          cp "$APK" \
            "output/XingChen-Assistant-${RELEASE_TAG}.apk"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: XingChen-Assistant-${{ steps.version.outputs.tag }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            output/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "星辰助手 $RELEASE_TAG" \
            --generate-notes

          echo "Published 星辰助手 $RELEASE_TAG"
